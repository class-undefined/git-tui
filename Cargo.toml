[package]
name = "git-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A mouse-friendly local Git TUI compatible with Git 1.8.3.1"
license = "MIT"
repository = "https://github.com/class-undefined/git-tui"
keywords = ["git", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
nix = { version = "0.30", features = ["signal", "process"] }
unicode-width = "0.2"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
